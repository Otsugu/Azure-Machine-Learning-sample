# ローカル PC（Windows / macOS / Linux）で本ハンズオンを動かすための conda 環境定義。
#
# 【Azure ML 側との違い】
#   Azure ML のジョブ実行環境は ../src/conda.yaml です。こちらはローカル実行専用で、
#   Notebook の実行と Azure ML へのジョブ投入に必要なものを追加で含みます。
#   模倣学習パッケージのバージョンは ../src/conda.yaml と一致させてください。
#
# 【⚠ pybullet を conda-forge から入れる理由】
#   PyPI の pybullet は Windows / macOS 向けのビルド済みホイールを公開していません。
#   そのまま pip で入れるとソースビルドになり、C++ コンパイラーが無い環境では失敗します。
#   conda-forge は win-64 向けのビルド済みパッケージを配布しているので、そちらから入れます。
#   出典: https://pypi.org/project/pybullet/#files ／ https://anaconda.org/conda-forge/pybullet
#
# 【numpy を 2 未満に固定する理由】
#   panda-gym の setup.py が install_requires に numpy<2 を指定しています。
#   出典: https://github.com/qgallouedec/panda-gym/blob/master/setup.py
#
# 【バージョンの根拠と検証した OS】
#   2026-08-17 に Windows 10 / Python 3.10.20 上で実際に導入して動作を確認した値です。
#   ⚠ macOS / Linux では未検証です。

name: il-panda
channels:
  - conda-forge
dependencies:
  - python=3.10
  - pip

  # ⚠ Windows / macOS では PyPI にホイールが無いため conda-forge から入れる
  - pybullet=3.2.5
  - numpy=1.26.4
  - scipy=1.15.2

  # Notebook を動かすため（ローカル実行専用）
  - jupyterlab
  - "ipykernel>=6.0"

  - pip:
      # --- 模倣学習（../src/conda.yaml と同じバージョンに固定） ---
      - imitation==1.0.1
      - stable-baselines3==2.2.1
      - gymnasium[classic-control]==0.29.1
      - seals==0.2.1

      # --- ロボット環境（pybullet は上の conda-forge 版が使われる） ---
      - panda-gym==3.0.7

      # --- Azure ML へのジョブ投入と MLflow への記録 ---
      - azure-ai-ml==1.34.1
      - azure-identity==1.25.3
      - mlflow==3.15.1
      - azureml-mlflow==1.60.0

      # --- notebooks の集計・可視化 ---
      - pandas==2.3.3
      - matplotlib==3.10.9
