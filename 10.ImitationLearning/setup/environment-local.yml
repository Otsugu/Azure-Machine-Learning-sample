# ローカル PC（Windows / macOS / Linux）で本ハンズオンを動かすための conda 環境定義。
#
# 【Azure ML 側との違い】
#   Azure ML のジョブ実行環境は ../src/conda.yaml です。こちらはローカル実行専用で、
#   Notebook の実行と Azure ML へのジョブ投入に必要なものを追加で含みます。
#   模倣学習パッケージのバージョンは ../src/conda.yaml と一致させてください。
#
# 【なぜ pip ではなく conda を使うのか】
#   本ハンズオンは Python 3.10 を前提にしています（imitation 1.0.1 の Trove classifiers は
#   3.8 / 3.9 / 3.10 まで。出典: https://pypi.org/pypi/imitation/json）。
#   読者の PC に入っている Python のバージョンは不定なため、
#   conda に「Python 3.10 のインタープリタ自体」を用意させます。
#   バイナリ依存（MuJoCo や PyBullet）は本ハンズオンにはありません。
#
# 【バージョンの根拠と検証した OS】
#   2026-08-17 に Windows 11 / Python 3.10.20 上で実際に解決された値です。推測値は含みません。
#   ⚠ macOS / Linux では未検証です。

name: il-local
channels:
  - conda-forge
dependencies:
  - python=3.10
  - pip

  # Notebook を動かすため（ローカル実行専用）
  - jupyterlab
  - "ipykernel>=6.0"

  - pip:
      # --- 模倣学習（../src/conda.yaml と同じバージョンに固定） ---
      - imitation==1.0.1
      - stable-baselines3==2.2.1
      - gymnasium[classic-control]==0.29.1
      - seals==0.2.1
      - numpy==2.2.6

      # --- Azure ML へのジョブ投入と MLflow への記録 ---
      - azure-ai-ml==1.34.1
      - azure-identity==1.25.3
      - mlflow==3.15.1
      - azureml-mlflow==1.60.0

      # --- notebooks の集計・可視化 ---
      - pandas==2.3.3
      - matplotlib==3.10.9
