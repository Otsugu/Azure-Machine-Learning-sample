# Azure Machine Learning のジョブ実行環境定義
#
# 【重要】このファイルは Azure ML の「カスタム環境（Environment）」を作るための conda 定義です。
#   ベース Docker イメージの上に、conda がこの定義どおりの Python 環境を新規作成します。
#   ベースイメージに入っている Python パッケージは、この conda 環境からは見えません。
#   出典: https://learn.microsoft.com/azure/machine-learning/how-to-manage-environments-v2?view=azureml-api-2
#
# 【バージョンの決め方】
#   ここに書かれたバージョンは、すべて 2026-08-17 に Windows 10 / Python 3.10.20 上で
#   実際に導入して動作を確認した結果です。推測値は含まれていません。
#
# 【numpy を 2 未満に固定する理由】
#   panda-gym の setup.py が install_requires に numpy<2 を指定しています。
#   出典: https://github.com/qgallouedec/panda-gym/blob/master/setup.py
#   ⚠ この点だけは 9.ReinforcementLearning と同じで、10 章の CartPole 版（numpy 2.x）とは異なります。
#
# 【stable-baselines3 を 2.2.1 に固定する理由】
#   imitation 1.0.1 の requires_dist が stable-baselines3~=2.2.1 を指定しています。
#   PEP 440 の互換リリース指定なので >=2.2.1, ==2.2.* と同義です。
#   出典: https://pypi.org/pypi/imitation/json ／ https://peps.python.org/pep-0440/#compatible-release
#   ⚠ そのため 9.ReinforcementLearning（2.4.1）とは環境を共有できません。
#
# 【pybullet の入手先】
#   Azure ML のコンピューティングは Linux なので、PyPI の manylinux ホイールが使えます。
#   panda-gym の依存として pip が自動的に導入します。
#   ⚠ Windows では PyPI にホイールが無いため、ローカル用の
#     ../setup/environment-local.yml では conda-forge から導入します。
#   出典: https://pypi.org/project/pybullet/#files
#
# 【検証した環境】
#   Windows 10 / Python 3.10.20 (conda-forge) でのみ検証済みです。
#   Azure ML のコンピューティングは Linux ですが、そこでの動作は未検証です。

name: il-panda-pick-and-place
channels:
  - conda-forge
dependencies:
  - python=3.10
  - pip
  - pip:
      # --- 模倣学習 (すべて MIT ライセンス。詳細は NOTICE.md) ---
      - imitation==1.0.1               # BC / DAgger / GAIL / AIRL などの実装
      - stable-baselines3==2.2.1       # imitation が ~=2.2.1 で要求
      - gymnasium[classic-control]==0.29.1  # 環境 API 規約。imitation が extra ごと要求する
      - seals==0.2.1                   # AbsorbAfterDoneWrapper（固定ホライズン化）に使う

      # --- ロボット環境 (MIT / zlib。詳細は NOTICE.md) ---
      - panda-gym==3.0.7               # Panda ロボットのピックアンドプレース。pybullet を引き込む
      - numpy==1.26.4                  # panda-gym の numpy<2 制約を満たす実測値
      - scipy==1.15.2                  # panda-gym の依存

      # --- 実験追跡 (Azure ML への記録に必須) ---
      - mlflow==3.15.1
      - azureml-mlflow==1.60.0

      # --- 集計・可視化 ---
      - pandas==2.3.3
      - matplotlib==3.10.9
